AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Word Counter Application

Globals:
  Function:
    Timeout: 10
    Runtime: python3.11

Resources:
  WordCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Architectures:
        - x86_64
      Events:
        WordCountApi:
          Type: Api
          Properties:
            Path: /count
            Method: post

Outputs:
  WordCountApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}://"
